[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-screenmask"
version = "0.1.0"
description = "Cover selected displays with a solid color"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.4"]

[project.scripts]
screenmask = "screenmask.app:main"

[tool.setuptools]
packages = ["screenmask"]

[tool.setuptools.data-files]
"share/icons/hicolor/scalable/apps" = ["assets/org.screenmask.ScreenMask.svg"]
